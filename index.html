<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Al-Mutairi Fiber Glass — Home</title>

<style>

/* ===== GLOBAL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#f4f9ff;
  color:#222;
  line-height:1.6;
}

/* ===== NAVBAR ===== */
.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
  background:#0c3c60;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
}

.brand a{
  color:white;
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
}

.nav-links{
  list-style:none;
  display:flex;
  gap:25px;
}

.nav-links a{
  color:white;
  text-decoration:none;
  font-weight:500;
  transition:.3s;
}

.nav-links a:hover{
  color:#d4af37;
}

.hamburger{
  display:none;
  background:none;
  border:none;
  color:white;
  font-size:26px;
  cursor:pointer;
}

/* ===== HERO ===== */
.hero{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  padding:70px 20px;
  gap:50px;
}

.hero-text{
  max-width:600px;
}

.hero-text h1{
  font-size:34px;
  margin-bottom:20px;
  color:#0c3c60;
  text-decoration:underline;
  text-underline-offset:6px;
}

.hero-images{
  display:flex;
  gap:25px;
}

.owner-img img{
  width:200px;
  height:200px;
  object-fit:cover;
  border-radius:15px;
  border:3px solid #d4af37;
}

/* ===== SECTIONS ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:60px 20px;
}

h2{
  text-align:center;
  margin-bottom:35px;
  color:#0c3c60;
}

/* ===== GRID ===== */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.product-card{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:.3s;
}

.product-card:hover{
  transform:translateY(-5px);
}

.product-card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:12px 25px;
  background:#d4af37;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  transition:.3s;
}

.btn:hover{
  background:#b9962e;
}

/* ===== ABOUT ===== */
.about-card{
  background:white;
  padding:40px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* ===== CONTACT SECTION ===== */
.contact-page{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.card{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* ===== SOCIAL ===== */
.social-links{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:40px 0;
}

.social-links a{
  border:2px solid #0c3c60;
  padding:18px;
  border-radius:50%;
  transition:.3s;
}

.social-links a:hover{
  background:#0c3c60;
}

.social-links img{
  width:30px;
}

/* ===== ORDER FORM ===== */
.order-section{
  max-width:800px;
  margin:50px auto;
  background:white;
  padding:40px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  font-weight:bold;
  display:block;
  margin-bottom:8px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
}

.order-btn{
  width:100%;
  padding:14px;
  background:#0c3c60;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.order-btn:hover{
  background:#082c47;
}

/* ===== FOOTER ===== */
.site-footer{
  background:#0c3c60;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:50px;
}

/* ===== MOBILE ===== */
@media(max-width:768px){

  .nav-links{
    display:none;
    flex-direction:column;
    position:absolute;
    top:70px;
    right:0;
    background:#0c3c60;
    width:200px;
    padding:20px;
  }

  .nav-links.open{
    display:flex;
  }

  .hamburger{
    display:block;
  }

  .hero{
    flex-direction:column;
    text-align:center;
  }

  .contact-page{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<!-- YOUR ORIGINAL CONTENT STAYS SAME ABOVE HERE -->

<!-- ORDER FORM ADDED BELOW SOCIAL LINKS -->

<section class="order-section">
  <h2 style="text-align:center;margin-bottom:25px;">Quick Order / Inquiry</h2>

  <div class="form-group">
    <label>Who you are (Your Email)</label>
    <input type="email" id="userEmail">
  </div>

  <div class="form-group">
    <label>What you want</label>
    <textarea id="userMessage"></textarea>
  </div>

  <div class="form-group">
    <label>Where are you from</label>
    <select id="userCity">
      <option value="">Select City</option>
      <option>Jeddah</option>
      <option>Riyadh</option>
      <option>Makkah</option>
      <option>Madinah</option>
      <option>Dammam</option>
      <option>Khobar</option>
      <option>Taif</option>
      <option>Abha</option>
      <option>Tabuk</option>
      <option>Hail</option>
      <option>Najran</option>
      <option>Jazan</option>
    </select>
  </div>

  <button class="order-btn" onclick="sendOrder()">Confirm Order</button>
</section>

<script>
function sendOrder(){
  const email=document.getElementById("userEmail").value;
  const message=document.getElementById("userMessage").value;
  const city=document.getElementById("userCity").value;

  if(email===""||message===""||city===""){
    alert("Please fill all fields.");
    return;
  }

  const subject="New Order from Website";
  const body=`Customer Email: ${email}
City: ${city}

Order Details:
${message}`;

  window.location.href=
  `mailto:ijazahmedpak87@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
</script>

</body>
</html>
